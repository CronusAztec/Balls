name = "jumpingballslive-billing"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# The site's public origins: CORS and every returnUrl are checked against them (localhost is also allowed in
# development). Several are separated by spaces or commas; the first is where the Stripe portal returns to when the site
# names no page. The site is served at jumpingballslive.com (and www) by the root wrangler.toml's Worker.
# --- go-live-kit --- `npm run go-live` (in the site's root) sets it for you.
[vars]
SITE_ORIGIN = "https://jumpingballslive.com https://www.jumpingballslive.com"

# The entitlement store. Create the namespace once with:
#   wrangler kv namespace create ENTITLEMENTS
# then paste the printed id below – it is not a secret, commit it – (`npm run go-live` does both for you; and, if you want
# a local store for `wrangler dev`, run
#   wrangler kv namespace create ENTITLEMENTS --preview
# and add preview_id too).
[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "f0d89f3fc6da4cd38fef90df645654d1"
# preview_id = "REPLACE_WITH_YOUR_PREVIEW_KV_NAMESPACE_ID"

# Every secret (LICENSE_PRIVATE_JWK, the Stripe / PayPal / NOWPayments keys) is set with
# `wrangler secret put <NAME>` — never in this file. See billing/README.md and .dev.vars.example.

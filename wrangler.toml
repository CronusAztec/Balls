# --- cloudflare-site --- The public site on Cloudflare: the static export in ./out served as Workers static assets by the
# "jumpingballslive" Worker, with jumpingballslive.com and www attached to it as custom domains. GitHub only keeps the code
# (the repository can be private); .github/workflows/deploy.yml builds the export for the root of the domain (no base path) and
# deploys it with the Wrangler that billing/package-lock.json pins, after the checks and the browser test, on every push to the
# product branch. By hand:
#   NEXT_PUBLIC_SITE_URL=https://jumpingballslive.com NEXT_PUBLIC_BASE_PATH= npm run build
#   (cd billing && npm ci) && npx --prefix billing wrangler deploy
# The billing Worker in billing/ has its own wrangler.toml; the Windows app's downloads are the Releases of a separate public repository (installers only), not part of this Worker.
name = "jumpingballslive"
compatibility_date = "2026-10-12"

# Preview URL: https://jumpingballslive.jumpingballslive.workers.dev
workers_dev = true

# The domain itself: Wrangler attaches it to the Worker as a custom domain on deploy and creates the DNS records for it
# (the zone jumpingballslive.com is on this account; the token needs the Workers Routes and DNS permissions for this).
routes = [
  { pattern = "jumpingballslive.com", custom_domain = true },
  { pattern = "www.jumpingballslive.com", custom_domain = true },
]

[assets]
directory = "./out"
# Unknown URLs get the localised 404 page (scripts/postexport.mjs writes out/404.html), like GitHub Pages.
not_found_handling = "404-page"
# Every page is exported as <route>/index.html (next.config.ts: trailingSlash), so /x redirects to /x/.
html_handling = "auto-trailing-slash"

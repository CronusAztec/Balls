name: Windows app

# --- desktop-exe --- Builds the Windows desktop app (desktop/, Electron) on a Windows runner:
#   1. the site's static export for the app (empty base path, share links on the public site),
#   2. the app's install, type check and unit tests,
#   3. the installer and the portable EXE (electron-builder, x64) – code-signed when the WIN_CSC_LINK /
#      WIN_CSC_KEY_PASSWORD secrets exist, unsigned otherwise (SmartScreen: "More info" → "Run anyway"),
#   4. a smoke run of the packaged app (`--smoke`: loads the simulator, checks the bridge and that the local AI starts,
#      reports the GPU, exits 0) – --- desktop-ai-fix --- with JBL_SMOKE_MODEL, a small GGUF (actions/cache) on which the
#      packaged app runs one Settings and one Captions job through its AI panel, AiService and llama.cpp (GPU auto),
#   5. the EXEs as workflow artifacts and – on a release – their publication: to the downloads repository (a second, PUBLIC
#      GitHub repository that holds the installers and no source code, https://github.com/CronusAztec/jumpingballslive-windows:
#      a release with the versioned EXEs, their blockmaps, electron-updater's latest.yml, SHA256SUMS.txt and copies under fixed
#      names – JumpingBallsLive-Setup.exe, JumpingBallsLive-portable.exe – that the site's download page links to;
#      scripts/release/publish-downloads.mjs, with the DOWNLOADS_REPO_TOKEN secret), then as a GitHub Release in this repository
#      (the archive; while this repository is public it is also where apps older than 1.1.0 look for updates). Nothing that users
#      download or update from needs this repository to be public. One-time setup: docs/RELEASING.md, "The downloads repository".
# --- desktop-autorelease --- A release happens (a) when a push to the product branch changes the version in
# desktop/package.json and no tag desktop-v<version> exists yet (`npm run release:desktop -- 1.0.4`, commit, push – the
# `decide` job compares desktop/package.json with the previous commit and asks GitHub for the tag), (b) on a pushed tag
# desktop-v*, (c) on a manual run with "publish" ticked. The release job creates the tag and the release with the workflow
# token, which starts no second run. Pull requests build and test only. docs/RELEASING.md explains it for the owner.
on:
  push:
    tags: ["desktop-v*"]
    branches: ["claude/optimistic-johnson-46x3qg", "main"]
    paths: ["desktop/package.json"]
  pull_request:
    paths: ["desktop/**", "src/lib/desktop/**", "src/components/simulator/desktop/**", ".github/workflows/desktop.yml", ".github/actions/site-url/**", "scripts/release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.2.0); empty: desktop/package.json's"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub Release (tag desktop-v<version>)"
        type: boolean
        default: false
      cuda:
        description: "Pack the llama.cpp CUDA build too (NVIDIA; ~180 MB more)"
        type: boolean
        default: false

# --- desktop-autorelease --- read-only by default; only the release job may write (the tag and the release).
permissions:
  contents: read

env:
  # The paywall's two public values, the same live pair as deploy.yml (a repository variable replaces either; tests keep them equal).
  LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY || 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE5Q9-e4H4jsJ0U34xlaAeMGIHpq5mV260PbJs0fVCZx5x3HgT9OTNN6Jk1WtKDGPxj6GkusFBjURGz240mV941A' }}
  BILLING_API_URL: ${{ vars.BILLING_API_URL || 'https://jumpingballslive-billing.jumpingballslive.workers.dev' }}
  # The downloads repository (the update feed, the installers): a second, public repository with releases only.
  DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'CronusAztec/jumpingballslive-windows' }}
  DOWNLOADS_URL: ${{ vars.DOWNLOADS_URL || format('https://github.com/{0}/releases/latest/download', vars.DOWNLOADS_REPO || 'CronusAztec/jumpingballslive-windows') }}

# --- desktop-autorelease --- a newer pull-request push supersedes its build; a release build (a tag or a branch push) is never
# cancelled – a second push to the branch queues behind it.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- desktop-autorelease --- what this run is: the version, whether to build, whether to release (scripts/release/desktop-version.mjs)
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Check out (this commit and its parent)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version, build, release?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release/desktop-version.mjs --decide

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    # --- desktop-ai-fix --- 60 → 90: the smoke run now also runs two real AI jobs on the CPU (bounded: JBL_SMOKE_AI_TIMEOUT_MS)
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ needs.decide.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: cd desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install the site's dependencies
        run: npm ci

      # --- desktop-autorelease --- the share links the app bakes in follow the site's real address (CUSTOM_DOMAIN, else jumpingballslive.com)
      - name: Work out the public URL
        id: site
        uses: ./.github/actions/site-url
        with:
          custom-domain: ${{ vars.CUSTOM_DOMAIN }}

      - name: Build the site for the app (empty base path)
        run: node desktop/scripts/build-site.mjs
        env:
          DESKTOP_SITE_URL: ${{ steps.site.outputs.url }}
          # --- paywall-gate / billing-backend --- the same public licence key and billing Worker origin as the website
          # (deploy.yml), so the app verifies the Worker's real licences and its Restore reaches the Worker (which grants the
          # app's app://jumpingballslive origin CORS).
          NEXT_PUBLIC_LICENSE_PUBLIC_KEY: ${{ env.LICENSE_PUBLIC_KEY }}
          NEXT_PUBLIC_BILLING_API: ${{ env.BILLING_API_URL }}
          # --- user-accounts --- the relay the app's Account page signs in to and connects TikTok, Instagram and YouTube
          # through (the same default as the website's deploy.yml). The relay allows the app's own origin
          # (app://jumpingballslive) by itself.
          NEXT_PUBLIC_PUBLISH_RELAY_URL: ${{ vars.PUBLISH_RELAY_URL || 'https://relay.jumpingballslive.com' }}
          # The app's own copy of the download page links to the downloads repository (src/lib/desktop/release.ts).
          NEXT_PUBLIC_DOWNLOADS_URL: ${{ env.DOWNLOADS_URL }}
          # The feedback form (the repository is private: no GitHub issues) and the legal pages, as on the website.
          NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          # --- go-live-kit --- the operator's public details the legal pages show (docs/GO-LIVE.md); empty while unset.
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          NEXT_PUBLIC_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          NEXT_PUBLIC_LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}

      - name: Install the app's dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check and test the app
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      - name: Code-signing certificate (optional)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$WIN_CSC_LINK" ]]; then
            echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the WIN_CSC_LINK certificate."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::notice::No WIN_CSC_LINK secret: the EXEs are unsigned (SmartScreen will warn)."
          fi

      - name: Package the installer and the portable EXE
        working-directory: desktop
        env:
          # --- desktop-autorelease --- the manual input, or the repository variable DESKTOP_CUDA=1 for automatic releases
          JBL_CUDA: ${{ (inputs.cuda || vars.DESKTOP_CUDA == '1') && '1' || '0' }}
          # --- desktop-autorelease --- baked into the main process (desktop/scripts/build.mjs `define`): the Help menu's links
          DESKTOP_SITE_URL: ${{ steps.site.outputs.url }}
          # the update feed electron-builder writes into the app (app-update.yml): latest.yml in the downloads repository
          JBL_UPDATE_URL: ${{ env.DOWNLOADS_URL }}
        run: npm run dist

      # --- desktop-ai-fix --- the real AI path in CI: the smallest catalog model (Qwen2.5-1.5B Q4_K_M, 1.1 GB), cached, its
      # SHA-256 the catalog's (desktop/src/models/catalog.ts)
      - name: Smoke model (cache)
        id: smoke-model
        uses: actions/cache@v4
        with:
          path: .cache/smoke-model
          key: smoke-gguf-qwen2.5-1.5b-instruct-q4_k_m-6a1a2eb6d156

      - name: Smoke model (download on a cache miss)
        if: steps.smoke-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/smoke-model
          curl -fsSL --retry 4 --retry-delay 5 -o .cache/smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          echo "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  .cache/smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf" | sha256sum -c -

      - name: Smoke-run the packaged app
        working-directory: desktop
        timeout-minutes: 30
        env:
          JBL_SMOKE_DATA: ${{ runner.temp }}\jbl-smoke-data
          JBL_SMOKE_TIMEOUT_MS: "120000"
          # --- desktop-ai-fix --- one Settings and one Captions job on this model, GPU auto (the runner has none: the CPU)
          JBL_SMOKE_MODEL: ${{ github.workspace }}\.cache\smoke-model\qwen2.5-1.5b-instruct-q4_k_m.gguf
          JBL_SMOKE_AI_TIMEOUT_MS: "1200000"
          JBL_VERBOSE: "1"
        run: |
          ./release/win-unpacked/JumpingBallsLive.exe --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log

      - name: Fixed-name copies for the site's download links
        working-directory: desktop/release
        run: |
          v="${{ needs.decide.outputs.version }}"
          cp "JumpingBallsLive-Setup-$v.exe" JumpingBallsLive-Setup.exe
          cp "JumpingBallsLive-$v-portable.exe" JumpingBallsLive-portable.exe
          ls -la
          sha256sum *.exe > SHA256SUMS.txt

      - name: Upload the EXEs
        uses: actions/upload-artifact@v4
        with:
          name: JumpingBallsLive-windows-${{ needs.decide.outputs.version }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the tag and the release
    steps:
      # Secrets cannot be tested in `if:`, so the first step fails with a plain message when it is missing – before anything is
      # published.
      - name: Check the downloads repository token
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: |
          [ -n "$DOWNLOADS_REPO_TOKEN" ] || { echo "::error title=DOWNLOADS_REPO_TOKEN is missing::Settings → Secrets and variables → Actions → Secrets: a fine-grained personal access token with Contents: Read and write on $DOWNLOADS_REPO only (docs/RELEASING.md, 'The downloads repository'). Then re-run this workflow."; exit 1; }

      - name: Check out (the publish script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the EXEs
        uses: actions/download-artifact@v4
        with:
          name: JumpingBallsLive-windows-${{ needs.decide.outputs.version }}
          path: dist

      # One draft release with every file, published in one step: an installed app that asks in between still sees the old
      # release (latest.yml and the installer it names), never a new latest.yml whose installer is not there yet.
      - name: Publish to the downloads repository
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: node scripts/release/publish-downloads.mjs --dir dist --version "$VERSION" --repo "$DOWNLOADS_REPO"

      # --- desktop-autorelease --- what every installed app reads: latest.yml there must name this version
      # (and the fixed-name installer must be the file that was built).
      - name: The downloads repository serves it
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: node scripts/release/publish-downloads.mjs --verify --dir dist --version "$VERSION" --url "$DOWNLOADS_URL"

      # The archive: the same files as a GitHub Release in this repository (private or public). The tag it creates is what the `decide` job asks for.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          tag="desktop-v$VERSION"
          notes="JumpingBallsLive for Windows $VERSION.

          - **Installer** (per user, no admin): JumpingBallsLive-Setup-$VERSION.exe – updates itself.
          - **Portable**: JumpingBallsLive-$VERSION-portable.exe – runs without installing.
          - **Downloads for everyone:** $DOWNLOADS_URL/JumpingBallsLive-Setup.exe and $DOWNLOADS_URL/JumpingBallsLive-portable.exe
          - **Coming from 1.0.2?** Its updater refuses unsigned updates: install this version once by hand (later versions update themselves).

          Unsigned builds: Windows SmartScreen shows \"Windows protected your PC\" – click *More info* → *Run anyway*. Checksums: SHA256SUMS.txt."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "JumpingBallsLive for Windows $VERSION" --notes "$notes" --generate-notes --target "$GITHUB_SHA"
          fi

      # While the repository is public, apps older than 1.1.0 still look for updates in GitHub Releases: the newest release's
      # latest.yml must name this version for them. (A private repository has no public release feed; those apps then need the
      # download page – docs/RELEASING.md says when to make the repository private.)
      - name: Apps older than 1.1.0 see the release (public repository)
        if: github.event.repository.private == false
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 20 "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.yml" | grep -q "^version: $VERSION\$"; then
              echo "…/releases/latest/download/latest.yml serves $VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=latest.yml does not serve $VERSION::https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.yml names another version after 2 minutes. Is a newer release marked as the latest? Apps older than 1.1.0 read this file."
          exit 1

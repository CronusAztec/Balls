name: Windows app

# --- desktop-exe --- Builds the Windows desktop app (desktop/, Electron) on a Windows runner:
#   1. the site's static export for the app (empty base path, share links on the public site),
#   2. the app's install, type check and unit tests,
#   3. the installer and the portable EXE (electron-builder, x64) – code-signed when the WIN_CSC_LINK /
#      WIN_CSC_KEY_PASSWORD secrets exist, unsigned otherwise (SmartScreen: "More info" → "Run anyway"),
#   4. a smoke run of the packaged app (`--smoke`: loads the simulator, checks the bridge and that the local AI starts,
#      reports the GPU, exits 0) – --- desktop-ai-fix --- with JBL_SMOKE_MODEL, a small GGUF (actions/cache) on which the
#      packaged app runs one Settings and one Captions job through its AI panel, AiService and llama.cpp (GPU auto),
#   5. the EXEs as workflow artifacts and – on a `desktop-v*` tag, or a manual run with a version and "publish" ticked –
#      a GitHub Release with the versioned EXEs, their blockmaps, electron-updater's latest.yml and copies under fixed
#      names (JumpingBallsLive-Setup.exe, JumpingBallsLive-portable.exe) that the site's download page links through
#      …/releases/latest/download/.
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", "src/lib/desktop/**", "src/components/simulator/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.2.0); empty: desktop/package.json's"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub Release (tag desktop-v<version>)"
        type: boolean
        default: false
      cuda:
        description: "Pack the llama.cpp CUDA build too (NVIDIA; ~180 MB more)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # --- desktop-ai-fix --- 60 → 90: the smoke run now also runs two real AI jobs on the CPU (bounded: JBL_SMOKE_AI_TIMEOUT_MS)
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then v="${GITHUB_REF#refs/tags/desktop-v}";
          elif [[ -n "${{ inputs.version }}" ]]; then v="${{ inputs.version }}";
          else v="$(node -p "require('./desktop/package.json').version")"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::'$v' is not a semantic version"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cd desktop && npm version "$v" --no-git-tag-version --allow-same-version

      - name: Install the site's dependencies
        run: npm ci

      - name: Build the site for the app (empty base path)
        run: node desktop/scripts/build-site.mjs
        env:
          DESKTOP_SITE_URL: https://cronusaztec.github.io/Balls
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          # --- paywall-gate / billing-backend --- the same public licence key and billing Worker origin as the website
          # (deploy.yml), so the app verifies the Worker's real licences and its Restore reaches the Worker (which grants the
          # app's app://jumpingballslive origin CORS). Empty while unset: the app is then in test mode, like the site.
          NEXT_PUBLIC_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          NEXT_PUBLIC_BILLING_API: ${{ vars.BILLING_API_URL }}

      - name: Install the app's dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check and test the app
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      - name: Code-signing certificate (optional)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [[ -n "$WIN_CSC_LINK" ]]; then
            echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the WIN_CSC_LINK certificate."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::notice::No WIN_CSC_LINK secret: the EXEs are unsigned (SmartScreen will warn)."
          fi

      - name: Package the installer and the portable EXE
        working-directory: desktop
        env:
          JBL_CUDA: ${{ inputs.cuda && '1' || '0' }}
        run: npm run dist

      # --- desktop-ai-fix --- the real AI path in CI: the smallest catalog model (Qwen2.5-1.5B Q4_K_M, 1.1 GB), cached, its
      # SHA-256 the catalog's (desktop/src/models/catalog.ts)
      - name: Smoke model (cache)
        id: smoke-model
        uses: actions/cache@v4
        with:
          path: .cache/smoke-model
          key: smoke-gguf-qwen2.5-1.5b-instruct-q4_k_m-6a1a2eb6d156

      - name: Smoke model (download on a cache miss)
        if: steps.smoke-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/smoke-model
          curl -fsSL --retry 4 --retry-delay 5 -o .cache/smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          echo "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e  .cache/smoke-model/qwen2.5-1.5b-instruct-q4_k_m.gguf" | sha256sum -c -

      - name: Smoke-run the packaged app
        working-directory: desktop
        timeout-minutes: 30
        env:
          JBL_SMOKE_DATA: ${{ runner.temp }}\jbl-smoke-data
          JBL_SMOKE_TIMEOUT_MS: "120000"
          # --- desktop-ai-fix --- one Settings and one Captions job on this model, GPU auto (the runner has none: the CPU)
          JBL_SMOKE_MODEL: ${{ github.workspace }}\.cache\smoke-model\qwen2.5-1.5b-instruct-q4_k_m.gguf
          JBL_SMOKE_AI_TIMEOUT_MS: "1200000"
          JBL_VERBOSE: "1"
        run: |
          ./release/win-unpacked/JumpingBallsLive.exe --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log

      - name: Fixed-name copies for the site's download links
        working-directory: desktop/release
        run: |
          v="${{ steps.version.outputs.version }}"
          cp "JumpingBallsLive-Setup-$v.exe" JumpingBallsLive-Setup.exe
          cp "JumpingBallsLive-$v-portable.exe" JumpingBallsLive-portable.exe
          ls -la
          sha256sum *.exe > SHA256SUMS.txt

      - name: Upload the EXEs
        uses: actions/upload-artifact@v4
        with:
          name: JumpingBallsLive-windows-${{ steps.version.outputs.version }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Download the EXEs
        uses: actions/download-artifact@v4
        with:
          name: JumpingBallsLive-windows-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="desktop-v$VERSION"
          notes="JumpingBallsLive for Windows $VERSION.

          - **Installer** (per user, no admin): JumpingBallsLive-Setup-$VERSION.exe – updates itself from this page.
          - **Portable**: JumpingBallsLive-$VERSION-portable.exe – runs without installing.
          - **Coming from 1.0.2?** Its updater refuses unsigned updates: install this version once by hand (later versions update themselves).

          Unsigned builds: Windows SmartScreen shows \"Windows protected your PC\" – click *More info* → *Run anyway*. Checksums: SHA256SUMS.txt."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "JumpingBallsLive for Windows $VERSION" --notes "$notes" --target "$GITHUB_SHA"
          fi

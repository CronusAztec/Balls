name: Build and deploy the site

# Every push is linted and type-checked. Pushes to the product branch (and manual runs from it) are then also unit-tested and
# built, run through the browser smoke test and, once all of it passes, published to https://jumpingballslive.com: the static
# export (out/) becomes the static assets of the "jumpingballslive" Cloudflare Worker (wrangler.toml at the repository root) that
# jumpingballslive.com and www are attached to. GitHub only keeps the code, so the repository can be private (GitHub Pages is not
# used: a private repository needs a paid GitHub plan for it).
# One-time setup: the repository secrets CLOUDFLARE_API_TOKEN (a token with "Edit Cloudflare Workers", shared with
# billing-deploy.yml) and CLOUDFLARE_ACCOUNT_ID. The deploy job says so by itself when they are missing.
# --- desktop-autorelease --- Only the product branch deploys: claude/optimistic-johnson-46x3qg (today) or main (when the owner
# renames it in the GitHub UI – both are listed so nothing needs editing that day). Every other branch – and a manual run from
# one – is only linted and type-checked (a private repository has 2,000 free Actions minutes a month; the unit tests, the build
# and the browser tests take about 60 of them per run). `env` is not available in a job-level `if`, so the branch test below is
# repeated verbatim in the smoke, smoke-summary and deploy jobs (tests/releaseWorkflows.test.ts keeps the copies identical).
on:
  push:
  workflow_dispatch:

# --- review fix (site-static) --- read-only by default (the build job runs `npm ci` with third-party install scripts).
permissions:
  contents: read

env:
  DEPLOY: ${{ contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref) }}
  # --- paywall-gate / billing-backend --- the paywall's two public values (billing/README.md step 8): the licence public key the
  # site verifies licences with and the billing Worker's origin. A repository variable overrides either; without one the live
  # values below apply (desktop.yml carries the same two, tests/releaseWorkflows.test.ts keeps them equal).
  LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY || 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE5Q9-e4H4jsJ0U34xlaAeMGIHpq5mV260PbJs0fVCZx5x3HgT9OTNN6Jk1WtKDGPxj6GkusFBjURGz240mV941A' }}
  BILLING_API_URL: ${{ vars.BILLING_API_URL || 'https://jumpingballslive-billing.jumpingballslive.workers.dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.site.outputs.url }}
    # A newer push to the same branch supersedes a build that is still running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # scripts/test-ci.mjs is `vitest run`, except that it does not fail a run in which every test passed and the only error is
      # vitest's own "Timeout calling onTaskUpdate" (a heavy simulation test starved its reporting channel on a busy runner).
      - name: Unit tests
        if: env.DEPLOY == 'true'
        run: npm run test:ci

      - name: Work out the public URL and base path
        id: site
        uses: ./.github/actions/site-url
        with:
          custom-domain: ${{ vars.CUSTOM_DOMAIN }}

      # --- go-live-kit --- a deploy to the product branch must be all-live or all-test: the billing values set together (and
      # never the public TEST key). The workflow's env supplies the live pair unless a repository variable replaces it.
      - name: Production guard (billing)
        if: env.DEPLOY == 'true'
        run: node scripts/go-live-check.mjs --deploy-guard

      # --- review fix (site-static) --- Next's build cache (the "No build cache found" warning)
      - name: Cache the Next.js build
        if: env.DEPLOY == 'true'
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-site-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-site-${{ hashFiles('package-lock.json') }}-

      - name: Date of the deployed commit (sitemap lastmod)
        if: env.DEPLOY == 'true'
        run: echo "SITEMAP_LASTMOD=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # `npm run build` without next's own lint pass: the Lint step above already ran ESLint on the whole repository.
      - name: Build static site
        if: env.DEPLOY == 'true'
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}
          # Feedback form: by default it opens issues on this repository, but only where visitors can (a public repository with
          # Issues on). A private repository has none, so the form then needs FEEDBACK_ENDPOINT, FEEDBACK_EMAIL or SUPPORT_EMAIL
          # (repository variables: Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_GITHUB_REPO: ${{ (github.event.repository.private == false && github.event.repository.has_issues == true) && github.repository || '' }}
          NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${{ vars.ANALYTICS_SCRIPT_URL }}
          NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.ANALYTICS_SITE_ID }}
          # --- social-publish / user-accounts --- the Publish block and the Account page: a Google OAuth client ID for direct
          # YouTube uploads and the relay (https://relay.jumpingballslive.com) they sign in to and publish through. Both are
          # public values; each visitor can also enter their own relay in the page.
          NEXT_PUBLIC_YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          NEXT_PUBLIC_PUBLISH_RELAY_URL: ${{ vars.PUBLISH_RELAY_URL || 'https://relay.jumpingballslive.com' }}
          NEXT_PUBLIC_LICENSE_PUBLIC_KEY: ${{ env.LICENSE_PUBLIC_KEY }}
          NEXT_PUBLIC_BILLING_API: ${{ env.BILLING_API_URL }}
          # The download page's links: the downloads host (a repository variable DOWNLOADS_URL replaces the default).
          NEXT_PUBLIC_DOWNLOADS_URL: ${{ vars.DOWNLOADS_URL }}
          # --- go-live-kit --- the operator's public details the legal pages show (docs/GO-LIVE.md); empty while unset.
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          NEXT_PUBLIC_LEGAL_NAME: ${{ vars.LEGAL_NAME }}
          NEXT_PUBLIC_LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}

      # The deploy job asks the live site for this file to learn that the new build is the one being served.
      - name: Stamp the build
        if: env.DEPLOY == 'true'
        run: printf '%s\n' "$GITHUB_SHA" > out/build.txt

      # --- desktop-autorelease --- the billing Worker allows exactly the origins in SITE_ORIGIN: a site on a new domain whose
      # Worker does not list it gets CORS errors on every checkout. A warning here; billing-deploy.yml refuses to deploy until fixed.
      - name: The billing Worker knows the site's domain
        if: env.DEPLOY == 'true'
        env:
          DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          if ! grep -E '^SITE_ORIGIN *=' billing/wrangler.toml | grep -Fq "https://$DOMAIN"; then
            echo "::warning title=billing/wrangler.toml does not list https://$DOMAIN::Add https://$DOMAIN to SITE_ORIGIN in billing/wrangler.toml, commit, and run the 'Deploy billing worker' workflow, or checkouts from the new domain are refused (CORS)."
          fi

      - name: Upload the site
        if: env.DEPLOY == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: site-out
          path: out
          include-hidden-files: true
          retention-days: 7

  # --- review fix (site-static) --- the browser smoke test (scripts/smoke-test.mjs: base path, 404, every page and mode,
  # recording...) gates every deploy. Feature-branch pushes skip it and stay fast; .github/workflows/smoke.yml runs it on pull
  # requests. Timing checks the runner itself was too busy to measure are reported as inconclusive and do not block a deploy
  # (smoke.yml runs them strictly).
  # --- smoke-sharding --- The suite runs as 4 shards on 4 runners at once (SMOKE_SHARD=x/4: every block of the suite in exactly
  # one of them, balanced by scripts/smoke-timing.json – README "Smoke test shards"); smoke-summary below gates the deploy on all
  # four.
  smoke:
    name: smoke (shard ${{ matrix.shard }} of 4)
    needs: build
    if: contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A newer push supersedes a smoke run in progress (its deploy is then skipped and the newer run deploys); one group per shard,
    # so the shards of one run do not cancel each other.
    concurrency:
      group: smoke-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-smoke-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-smoke-${{ hashFiles('package-lock.json') }}-

      - name: Build static site under a base path
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000/smoke
          NEXT_PUBLIC_BASE_PATH: /smoke
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}

      - name: Serve and test
        env:
          BASE_URL: http://localhost:3000/smoke
          SMOKE_SHARD: ${{ matrix.shard }}/4
          OUT_DIR: smoke-output/shard-${{ matrix.shard }}
        run: |
          node scripts/serve-static.mjs --port 3000 --base /smoke &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/smoke/en/ > /dev/null && break; sleep 1; done
          npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: smoke-output/shard-${{ matrix.shard }}
          if-no-files-found: ignore

  # --- smoke-sharding --- The four shards' screenshots in one artifact (smoke-screenshots, a folder per shard), their slowest blocks
  # merged (and checked: every block of the suite ran in exactly one shard), and the gate: it fails unless every shard passed.
  smoke-summary:
    needs: smoke
    if: always() && contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # this run's shard jobs, and whether a newer run of this workflow superseded it (the verdict below)
      checks: read # a cancelled shard's annotations: did it run out of time? (the verdict below)
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the shards' screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: smoke-screenshots-*
          path: smoke-screenshots

      - name: Slowest blocks of all shards
        id: summary
        continue-on-error: true
        run: node scripts/smoke/summary.mjs smoke-screenshots

      - name: Upload the merged screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore

      # The verdict the deploy waits for (scripts/smoke/verdict.mjs): every shard passed and every block of the suite ran in exactly
      # one of them. A run a newer push superseded (its build cancelled before the shards, or its shards cancelled while a newer
      # run of this workflow on this branch exists) deploys nothing and is not a failure – but GitHub ends a shard that hits its
      # timeout-minutes as `cancelled` too, so a cancelled shard is looked up in this run's jobs: one that ran out of time (GitHub's
      # "exceeded the maximum execution time" annotation, or 44 of its 45 minutes) fails the verdict, newer run or not, like a
      # shard that failed. A shard cancelled with no newer run, and a lookup that fails, fail it as well.
      - name: Every shard passed
        if: always()
        env:
          RESULT: ${{ needs.smoke.result }}
          SUMMARY: ${{ steps.summary.outcome }}
          # the smoke job's timeout-minutes (tests/smokeShards.test.ts keeps the two equal)
          SHARD_TIMEOUT_MINUTES: 45
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: node scripts/smoke/verdict.mjs

  deploy:
    # Publishes out/ as the static assets of the Cloudflare Worker "jumpingballslive" (wrangler.toml at the repository root, which
    # also attaches jumpingballslive.com and www to it), then asks the live site for the build stamp to learn that this build is
    # the one being served. Secrets cannot be tested in `if:`, so the first step fails with a plain message when they are missing.
    needs: [build, smoke, smoke-summary]
    if: contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # One deployment at a time; a queued run waits instead of cancelling one in progress.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - name: Check the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=1
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=CLOUDFLARE_API_TOKEN is missing::Settings → Secrets and variables → Actions → Secrets → New repository secret: a Cloudflare API token with 'Edit Cloudflare Workers' (the one billing-deploy.yml uses), then re-run this workflow."; ok=0; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=CLOUDFLARE_ACCOUNT_ID is missing::Cloudflare dashboard → Workers & Pages → Account ID (right-hand column); add it as a repository secret, then re-run this workflow."; ok=0; }
          [ "$ok" = 1 ]

      - name: Check out
        uses: actions/checkout@v5

      - name: Download the site
        uses: actions/download-artifact@v7
        with:
          name: site-out
          path: out

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: billing/package-lock.json

      # Wrangler comes from the billing package, at the version its lock file pins.
      - name: Install Wrangler
        run: npm ci --prefix billing

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix billing wrangler deploy

      - name: The new build answers
        env:
          URL: ${{ needs.build.outputs.url }}
        run: |
          last="no answer"
          for i in $(seq 1 18); do
            code="$(curl -s --max-time 20 -o answer.txt -w '%{http_code}' "$URL/build.txt?x=$i" || true)"
            if [ "$code" = 200 ] && [ "$(tr -d '[:space:]' < answer.txt)" = "$GITHUB_SHA" ]; then
              echo "live: $URL is serving $GITHUB_SHA"
              exit 0
            fi
            last="HTTP $code, $(head -c 80 answer.txt 2> /dev/null | tr -d '\n')"
            sleep 10
          done
          echo "::error title=The site does not serve this build::$URL/build.txt does not name $GITHUB_SHA after 3 minutes (last answer: $last). If the domain is not attached to the Worker named in wrangler.toml, see Cloudflare dashboard → Workers & Pages → jumpingballslive → Settings → Domains & Routes; a 403 or a challenge page means a Cloudflare bot or firewall rule is turning GitHub's runners away (Security → Bots / WAF)."
          exit 1

      # The download page links to the downloads host (a Cloudflare R2 bucket). A warning, not a failure, while it is not set up yet
      # or the first release has not been published (docs/RELEASING.md, "The downloads host").
      - name: The downloads host answers
        env:
          DOWNLOADS_URL: ${{ vars.DOWNLOADS_URL || 'https://downloads.jumpingballslive.com' }}
        run: |
          if curl -fsSI --max-time 20 "$DOWNLOADS_URL/JumpingBallsLive-Setup.exe" > /dev/null; then
            echo "$DOWNLOADS_URL serves the installer"
          else
            echo "::warning title=The Download buttons point at $DOWNLOADS_URL, which does not serve the installer yet::Set up the downloads host and publish a Windows release (docs/RELEASING.md, 'The downloads host'); until then the website's Download buttons show an error page."
          fi

name: Build and deploy to GitHub Pages

# Every push is linted, type-checked, unit-tested and built. Pushes to the product branch (and
# manual runs from it) then run the browser smoke test against a base-path build and, once it
# passes, are published to GitHub Pages.
# One-time setup: Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
# --- desktop-autorelease --- Only the product branch deploys: claude/optimistic-johnson-46x3qg (today) or main (when the owner
# renames it in the GitHub UI – both are listed so nothing needs editing that day). Every other branch – and a manual run from
# one – is built and checked, nothing more. The repository variable CUSTOM_DOMAIN switches the build to a custom domain (empty
# base path, out/CNAME); SITE_HOST=cloudflare-pages deploys the same out/ to Cloudflare Pages instead of GitHub Pages
# (docs/RELEASING.md). `env` is not available in a job-level `if`, so the branch test below is repeated verbatim in the smoke,
# smoke-summary, deploy and deploy-cloudflare jobs (tests/releaseWorkflows.test.ts keeps the copies identical).
on:
  push:
  workflow_dispatch:

# --- review fix (site-static) --- read-only by default; only the deploy job gets the Pages and OIDC write scopes (the build
# job runs `npm ci` with third-party install scripts).
permissions:
  contents: read

env:
  DEPLOY: ${{ contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # the Pages settings lookup below (custom domain)
    # --- desktop-autorelease --- the site's address and host, for the deploy-cloudflare job
    outputs:
      url: ${{ steps.site.outputs.url }}
      host: ${{ steps.site.outputs.host }}
    # A newer push to the same branch supersedes a build that is still running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Work out the public URL and base path
        id: site
        uses: ./.github/actions/site-url
        with:
          custom-domain: ${{ vars.CUSTOM_DOMAIN }}
          site-host: ${{ vars.SITE_HOST }}
          cf-pages-project: ${{ vars.CF_PAGES_PROJECT }}
          token: ${{ github.token }}

      # --- review fix (site-static) --- Next's build cache (the "No build cache found" warning)
      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-pages-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-pages-${{ hashFiles('package-lock.json') }}-

      - name: Date of the deployed commit (sitemap lastmod)
        run: echo "SITEMAP_LASTMOD=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # `npm run build` without next's own lint pass: the Lint step above already ran ESLint on the whole repository.
      - name: Build static site
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}
          # Feedback form: by default it opens issues on this repository, but only where visitors
          # can (public repository with Issues on). Repository variables (Settings → Secrets and
          # variables → Actions → Variables) take precedence and are the way to go for a private site.
          NEXT_PUBLIC_GITHUB_REPO: ${{ (github.event.repository.private == false && github.event.repository.has_issues == true) && github.repository || '' }}
          NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${{ vars.ANALYTICS_SCRIPT_URL }}
          NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.ANALYTICS_SITE_ID }}
          # --- social-publish --- the Publish block: a Google OAuth client ID for direct YouTube uploads and a relay URL
          # the relay form suggests (both public values; each visitor can also enter their own in the block).
          NEXT_PUBLIC_YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          NEXT_PUBLIC_PUBLISH_RELAY_URL: ${{ vars.PUBLISH_RELAY_URL }}
          # --- paywall-gate --- the licence public key (base64url SPKI, `node scripts/billing-keygen.mjs` line 2) and the billing
          # Worker's origin – both public. Empty while unset: the site is then in test mode and the pay buttons say payments are
          # not configured. (The smoke job builds without them on purpose: it records with test licences.)
          NEXT_PUBLIC_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          NEXT_PUBLIC_BILLING_API: ${{ vars.BILLING_API_URL }}

      # --- desktop-autorelease --- GitHub ignores CNAME for Actions deployments, but out/ then works on any static host as is.
      - name: Custom domain file (out/CNAME)
        if: steps.site.outputs.domain != ''
        env:
          DOMAIN: ${{ steps.site.outputs.domain }}
        run: printf '%s\n' "$DOMAIN" > out/CNAME && echo "wrote out/CNAME ($DOMAIN)"

      # --- desktop-autorelease --- the billing Worker allows exactly the origins in SITE_ORIGIN: a site on a new domain whose
      # Worker does not list it gets CORS errors on every checkout. A warning here; billing-deploy.yml refuses to deploy until fixed.
      - name: The billing Worker knows the custom domain
        if: env.DEPLOY == 'true' && steps.site.outputs.domain != ''
        env:
          DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          if ! grep -E '^SITE_ORIGIN *=' billing/wrangler.toml | grep -Fq "https://$DOMAIN"; then
            echo "::warning title=billing/wrangler.toml does not list https://$DOMAIN::Add https://$DOMAIN to SITE_ORIGIN in billing/wrangler.toml (npm run go-live does it), commit, and run the 'Deploy billing worker' workflow, or checkouts from the new domain are refused (CORS)."
          fi

      - name: Upload site artifact (GitHub Pages)
        if: env.DEPLOY == 'true' && steps.site.outputs.host == 'github-pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Upload site artifact (Cloudflare Pages)
        if: env.DEPLOY == 'true' && steps.site.outputs.host == 'cloudflare-pages'
        uses: actions/upload-artifact@v6
        with:
          name: site-out
          path: out
          include-hidden-files: true
          retention-days: 7

  # --- review fix (site-static) --- the browser smoke test (scripts/smoke-test.mjs: base path, 404, every page and mode,
  # recording...) gates every deploy. Feature-branch pushes skip it and stay fast; .github/workflows/smoke.yml runs it on pull
  # requests. Timing checks the runner itself was too busy to measure are reported as inconclusive and do not block a deploy
  # (smoke.yml runs them strictly).
  # --- smoke-sharding --- The suite runs as 4 shards on 4 runners at once (SMOKE_SHARD=x/4: every block of the suite in exactly
  # one of them, balanced by scripts/smoke-timing.json – README "Smoke test shards"); smoke-summary below gates the deploy on all
  # four.
  smoke:
    name: smoke (shard ${{ matrix.shard }} of 4)
    needs: build
    if: contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A newer push supersedes a smoke run in progress (its deploy is then skipped and the newer run deploys); one group per shard,
    # so the shards of one run do not cancel each other.
    concurrency:
      group: smoke-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-smoke-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-smoke-${{ hashFiles('package-lock.json') }}-

      - name: Build static site under a base path
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000/smoke
          NEXT_PUBLIC_BASE_PATH: /smoke
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}

      - name: Serve and test
        env:
          BASE_URL: http://localhost:3000/smoke
          SMOKE_SHARD: ${{ matrix.shard }}/4
          OUT_DIR: smoke-output/shard-${{ matrix.shard }}
        run: |
          node scripts/serve-static.mjs --port 3000 --base /smoke &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/smoke/en/ > /dev/null && break; sleep 1; done
          npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: smoke-output/shard-${{ matrix.shard }}
          if-no-files-found: ignore

  # --- smoke-sharding --- The four shards' screenshots in one artifact (smoke-screenshots, a folder per shard), their slowest blocks
  # merged (and checked: every block of the suite ran in exactly one shard), and the gate: it fails unless every shard passed.
  smoke-summary:
    needs: smoke
    if: always() && contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # this run's shard jobs, and whether a newer run of this workflow superseded it (the verdict below)
      checks: read # a cancelled shard's annotations: did it run out of time? (the verdict below)
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the shards' screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: smoke-screenshots-*
          path: smoke-screenshots

      - name: Slowest blocks of all shards
        id: summary
        continue-on-error: true
        run: node scripts/smoke/summary.mjs smoke-screenshots

      - name: Upload the merged screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore

      # The verdict the deploy waits for (scripts/smoke/verdict.mjs): every shard passed and every block of the suite ran in exactly
      # one of them. A run a newer push superseded (its build cancelled before the shards, or its shards cancelled while a newer
      # run of this workflow on this branch exists) deploys nothing and is not a failure – but GitHub ends a shard that hits its
      # timeout-minutes as `cancelled` too, so a cancelled shard is looked up in this run's jobs: one that ran out of time (GitHub's
      # "exceeded the maximum execution time" annotation, or 44 of its 45 minutes) fails the verdict, newer run or not, like a
      # shard that failed. A shard cancelled with no newer run, and a lookup that fails, fail it as well.
      - name: Every shard passed
        if: always()
        env:
          RESULT: ${{ needs.smoke.result }}
          SUMMARY: ${{ steps.summary.outcome }}
          # the smoke job's timeout-minutes (tests/smokeShards.test.ts keeps the two equal)
          SHARD_TIMEOUT_MINUTES: 45
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: node scripts/smoke/verdict.mjs

  deploy:
    needs: [build, smoke, smoke-summary]
    if: vars.SITE_HOST != 'cloudflare-pages' && contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time; a queued run waits instead of cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The workflow token cannot switch Pages on; a person has to do it once in the repository
      # settings. Fail with instructions instead of the raw API error.
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "::error title=GitHub Pages is not enabled for this repository::Enable it once under Settings → Pages → Build and deployment → Source: \"GitHub Actions\", then re-run this workflow. Private repositories need GitHub Pro, Team or Enterprise for Pages; otherwise make the repository public."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      # --- desktop-autorelease --- the published site answers (a warning, not a failure: a fresh custom domain can take up to
      # 48 h of DNS propagation)
      - name: The site answers
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 20 "${URL%/}/en/" | grep -q "<html"; then echo "live: ${URL%/}/en/"; exit 0; fi
            sleep 10
          done
          echo "::warning title=The site did not answer within 2 minutes::${URL%/}/en/ – a new custom domain can take up to 48 h of DNS propagation; check Settings → Pages."

  # --- desktop-autorelease --- the optional host: Cloudflare Pages (free, private repositories allowed, the same Cloudflare account
  # as the billing Worker). On when the repository variable SITE_HOST is `cloudflare-pages`; the deploy job above then skips.
  # One-time: `npx wrangler pages project create <name> --production-branch main`, the variable CF_PAGES_PROJECT=<name>, and the
  # secrets CLOUDFLARE_API_TOKEN (a token that also has "Cloudflare Pages: Edit") / CLOUDFLARE_ACCOUNT_ID. Secrets cannot be
  # tested in `if:`, so the first step fails with a plain message when they are missing. The Windows app's downloads and updates
  # still come from GitHub Releases, which need a public repository (docs/RELEASING.md, "Hosting").
  deploy-cloudflare:
    needs: [build, smoke, smoke-summary]
    if: vars.SITE_HOST == 'cloudflare-pages' && contains(fromJSON('["refs/heads/claude/optimistic-johnson-46x3qg","refs/heads/main"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: cloudflare-pages
      url: ${{ needs.build.outputs.url }}
    steps:
      - name: Check the Cloudflare secrets and the project name
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          ok=1
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=CLOUDFLARE_API_TOKEN is missing::Settings → Secrets and variables → Actions → Secrets → New repository secret: a Cloudflare API token with 'Cloudflare Pages: Edit' (and 'Edit Cloudflare Workers' for the billing Worker)."; ok=0; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=CLOUDFLARE_ACCOUNT_ID is missing::Cloudflare dashboard → Workers & Pages → Account ID (right-hand column); add it as a repository secret."; ok=0; }
          [ -n "$CF_PAGES_PROJECT" ] || { echo "::error title=CF_PAGES_PROJECT is missing::Create the Pages project once (npx wrangler pages project create <name> --production-branch main) and set the repository variable CF_PAGES_PROJECT to its name."; ok=0; }
          [ "$ok" = 1 ]

      - name: Download the site
        uses: actions/download-artifact@v7
        with:
          name: site-out
          path: out

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: npx --yes wrangler@3 pages deploy out --project-name "$CF_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true

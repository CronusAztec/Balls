name: Build and deploy to GitHub Pages

# Every push is linted, type-checked, unit-tested and built. Pushes to the repository's default
# branch (and manual runs from any branch) then run the browser smoke test against a base-path
# build and, once it passes, are published to GitHub Pages.
# One-time setup: Settings → Pages → "Build and deployment" → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

# --- review fix (site-static) --- read-only by default; only the deploy job gets the Pages and OIDC write scopes (the build
# job runs `npm ci` with third-party install scripts).
permissions:
  contents: read

env:
  DEPLOY: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # the Pages settings lookup below (custom domain)
    # A newer push to the same branch supersedes a build that is still running.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Work out the public URL and base path
        id: site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Prefer the URL GitHub has configured for this repository's Pages site (this is how a
          # custom domain set under Settings → Pages is picked up); fall back to the conventional
          # project-site URL while Pages is not enabled yet.
          if url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url' 2>/dev/null)" && [ -n "$url" ]; then
            source="the Pages settings"
          else
            owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            if [ "$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
              url="https://$owner.github.io"
            else
              url="https://$owner.github.io/$REPO"
            fi
            source="the repository name (Pages is not enabled yet)"
          fi
          url="${url%/}"
          base="$(printf '%s' "$url" | sed -E 's#^https?://[^/]*##')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Site URL: $url (base path: '$base', from $source)"

      # --- review fix (site-static) --- Next's build cache (the "No build cache found" warning)
      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-pages-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-pages-${{ hashFiles('package-lock.json') }}-

      - name: Date of the deployed commit (sitemap lastmod)
        run: echo "SITEMAP_LASTMOD=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # `npm run build` without next's own lint pass: the Lint step above already ran ESLint on the whole repository.
      - name: Build static site
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}
          # Feedback form: by default it opens issues on this repository, but only where visitors
          # can (public repository with Issues on). Repository variables (Settings → Secrets and
          # variables → Actions → Variables) take precedence and are the way to go for a private site.
          NEXT_PUBLIC_GITHUB_REPO: ${{ (github.event.repository.private == false && github.event.repository.has_issues == true) && github.repository || '' }}
          NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${{ vars.ANALYTICS_SCRIPT_URL }}
          NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.ANALYTICS_SITE_ID }}
          # --- social-publish --- the Publish block: a Google OAuth client ID for direct YouTube uploads and a relay URL
          # the relay form suggests (both public values; each visitor can also enter their own in the block).
          NEXT_PUBLIC_YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          NEXT_PUBLIC_PUBLISH_RELAY_URL: ${{ vars.PUBLISH_RELAY_URL }}
          # --- paywall-gate --- the licence public key (base64url SPKI, `node scripts/billing-keygen.mjs` line 2) and the billing
          # Worker's origin – both public. Empty while unset: the site is then in test mode and the pay buttons say payments are
          # not configured. (The smoke job builds without them on purpose: it records with test licences.)
          NEXT_PUBLIC_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          NEXT_PUBLIC_BILLING_API: ${{ vars.BILLING_API_URL }}

      - name: Upload site artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # --- review fix (site-static) --- the browser smoke test (scripts/smoke-test.mjs: base path, 404, every page and mode,
  # recording...) gates every deploy. Feature-branch pushes skip it and stay fast; .github/workflows/smoke.yml runs it on pull
  # requests. Timing checks the runner itself was too busy to measure are reported as inconclusive and do not block a deploy
  # (smoke.yml runs them strictly).
  # --- smoke-sharding --- The suite runs as 4 shards on 4 runners at once (SMOKE_SHARD=x/4: every block of the suite in exactly
  # one of them, balanced by scripts/smoke-timing.json – README "Smoke test shards"); smoke-summary below gates the deploy on all
  # four.
  smoke:
    name: smoke (shard ${{ matrix.shard }} of 4)
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A newer push supersedes a smoke run in progress (its deploy is then skipped and the newer run deploys); one group per shard,
    # so the shards of one run do not cancel each other.
    concurrency:
      group: smoke-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-smoke-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-smoke-${{ hashFiles('package-lock.json') }}-

      - name: Build static site under a base path
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000/smoke
          NEXT_PUBLIC_BASE_PATH: /smoke
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}

      - name: Serve and test
        env:
          BASE_URL: http://localhost:3000/smoke
          SMOKE_SHARD: ${{ matrix.shard }}/4
          OUT_DIR: smoke-output/shard-${{ matrix.shard }}
        run: |
          node scripts/serve-static.mjs --port 3000 --base /smoke &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/smoke/en/ > /dev/null && break; sleep 1; done
          npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: smoke-output/shard-${{ matrix.shard }}
          if-no-files-found: ignore

  # --- smoke-sharding --- The four shards' screenshots in one artifact (smoke-screenshots, a folder per shard), their slowest blocks
  # merged (and checked: every block of the suite ran in exactly one shard), and the gate: it fails unless every shard passed.
  smoke-summary:
    needs: smoke
    if: always() && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the shards' screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: smoke-screenshots-*
          path: smoke-screenshots

      - name: Slowest blocks of all shards
        id: summary
        continue-on-error: true
        run: node scripts/smoke/summary.mjs smoke-screenshots

      - name: Upload the merged screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore

      # A superseded run (its build or shards cancelled by a newer push) is not a failure; the deploy needs the shards anyway.
      - name: Every shard passed
        if: always()
        env:
          RESULT: ${{ needs.smoke.result }}
          SUMMARY: ${{ steps.summary.outcome }}
        run: |
          case "$RESULT" in
            success) ;;
            cancelled | skipped)
              echo "::notice title=Smoke test::the smoke shards were $RESULT (a newer push supersedes this run); nothing is deployed"
              exit 0 ;;
            *)
              echo "::error title=Smoke test::a smoke shard ended with '$RESULT' – see the failing 'smoke (shard x of 4)' job"
              exit 1 ;;
          esac
          if [ "$SUMMARY" != "success" ]; then
            echo "::error title=Smoke test::every shard passed, but not every block of the suite ran in exactly one of them (see 'Slowest blocks of all shards')"
            exit 1
          fi
          echo "All four smoke shards passed, every block of the suite in exactly one of them."

  deploy:
    needs: [build, smoke, smoke-summary]
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time; a queued run waits instead of cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The workflow token cannot switch Pages on; a person has to do it once in the repository
      # settings. Fail with instructions instead of the raw API error.
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "::error title=GitHub Pages is not enabled for this repository::Enable it once under Settings → Pages → Build and deployment → Source: \"GitHub Actions\", then re-run this workflow. Private repositories need GitHub Pro, Team or Enterprise for Pages; otherwise make the repository public."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

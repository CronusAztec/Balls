name: Deploy to Cloudflare

# --- cloudflare-site --- Publishes the site at https://jumpingballslive.com: the same static export as the GitHub Pages
# deploy (deploy.yml), built for the root of the domain (no base path) and uploaded as the static assets of the
# "jumpingballslive" Cloudflare Worker (wrangler.toml at the repository root). Runs on every push to the default branch
# (other branches are skipped, like deploy.yml) and on demand from the Actions tab; the GitHub Pages deploy is untouched and still runs alongside.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions -> Secrets), shared with billing-deploy.yml:
#   CLOUDFLARE_API_TOKEN   - a token with the "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
# The repository variables deploy.yml reads (FEEDBACK_*, ANALYTICS_*, YOUTUBE_CLIENT_ID, PUBLISH_RELAY_URL,
# LICENSE_PUBLIC_KEY, BILLING_API_URL) apply to this build too.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cache the Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-cloudflare-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-cloudflare-${{ hashFiles('package-lock.json') }}-

      - name: Date of the deployed commit (sitemap lastmod)
        run: echo "SITEMAP_LASTMOD=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Build static site for the root of jumpingballslive.com
        run: npx next build --no-lint && node scripts/postexport.mjs
        env:
          NEXT_PUBLIC_SITE_URL: https://jumpingballslive.com
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_GITHUB_REPO: ${{ (github.event.repository.private == false && github.event.repository.has_issues == true) && github.repository || '' }}
          NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${{ vars.FEEDBACK_ENDPOINT }}
          NEXT_PUBLIC_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${{ vars.ANALYTICS_SCRIPT_URL }}
          NEXT_PUBLIC_ANALYTICS_SITE_ID: ${{ vars.ANALYTICS_SITE_ID }}
          NEXT_PUBLIC_YOUTUBE_CLIENT_ID: ${{ vars.YOUTUBE_CLIENT_ID }}
          NEXT_PUBLIC_PUBLISH_RELAY_URL: ${{ vars.PUBLISH_RELAY_URL }}
          # The paywall's two public values (billing/README.md step 8): the licence public key the site verifies licences with
          # and the billing Worker's origin. A repository variable overrides either; without one the live values below apply.
          NEXT_PUBLIC_LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY || 'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE5Q9-e4H4jsJ0U34xlaAeMGIHpq5mV260PbJs0fVCZx5x3HgT9OTNN6Jk1WtKDGPxj6GkusFBjURGz240mV941A' }}
          NEXT_PUBLIC_BILLING_API: ${{ vars.BILLING_API_URL || 'https://jumpingballslive-billing.jumpingballslive.workers.dev' }}

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

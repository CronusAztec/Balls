name: Browser smoke test

# Builds the site under a base path, serves it like GitHub Pages does and runs the headless
# Chromium end-to-end checks (every page and locale, every mode, recording, seed finder...)
# on pull requests and on demand. Pushes to the default branch run the same suite as the
# `smoke` job of deploy.yml, which gates the Pages deploy.
# --- smoke-sharding --- The suite runs as 4 shards on 4 runners at once (SMOKE_SHARD=x/4: every block of the suite in exactly
# one of them, balanced by scripts/smoke-timing.json – README "Smoke test shards"); smoke-summary merges their screenshots and
# slowest blocks and fails unless every shard passed.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # --- review fix (site-static) --- the suite waits up to 120 s at a time: bound a hang instead of the 6-hour default
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000/smoke
          NEXT_PUBLIC_BASE_PATH: /smoke
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}

      - name: Serve and test
        env:
          BASE_URL: http://localhost:3000/smoke
          # A dedicated runner: a timing check that fails twice fails, even when the runner looks busy.
          SMOKE_STRICT_TIMING: "1"
          SMOKE_SHARD: ${{ matrix.shard }}/4
          OUT_DIR: smoke-output/shard-${{ matrix.shard }}
        run: |
          node scripts/serve-static.mjs --port 3000 --base /smoke &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/smoke/en/ > /dev/null && break; sleep 1; done
          npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: smoke-output/shard-${{ matrix.shard }}
          if-no-files-found: ignore

  # --- smoke-sharding --- The four shards' screenshots in one artifact (smoke-screenshots, a folder per shard), their slowest blocks
  # merged (and checked: every block of the suite ran in exactly one shard), and the verdict: it fails unless every shard passed.
  smoke-summary:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the shards' screenshots
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: smoke-screenshots-*
          path: smoke-screenshots

      - name: Slowest blocks of all shards
        id: summary
        continue-on-error: true
        run: node scripts/smoke/summary.mjs smoke-screenshots

      - name: Upload the merged screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshots
          path: smoke-screenshots
          if-no-files-found: ignore

      - name: Every shard passed
        if: always()
        env:
          RESULT: ${{ needs.smoke.result }}
          SUMMARY: ${{ steps.summary.outcome }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error title=Smoke test::the smoke shards ended with '$RESULT' – see the failing 'smoke (shard x of 4)' job"
            exit 1
          fi
          if [ "$SUMMARY" != "success" ]; then
            echo "::error title=Smoke test::every shard passed, but not every block of the suite ran in exactly one of them (see 'Slowest blocks of all shards')"
            exit 1
          fi
          echo "All four smoke shards passed, every block of the suite in exactly one of them."

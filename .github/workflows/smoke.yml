name: Browser smoke test

# Builds the site under a base path, serves it like GitHub Pages does and runs the headless
# Chromium end-to-end checks (every page and locale, every mode, recording, seed finder...).
on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000/smoke
          NEXT_PUBLIC_BASE_PATH: /smoke
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}

      - name: Serve and test
        env:
          BASE_URL: http://localhost:3000/smoke
        run: |
          node scripts/serve-static.mjs --port 3000 --base /smoke &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/smoke/en/ > /dev/null && break; sleep 1; done
          npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-output
          if-no-files-found: ignore

name: Site URL
description: >-
  The public URL and domain of the site build, for deploy.yml (the website) and desktop.yml (the share links baked into the
  Windows app). The site is served from the root of a domain by Cloudflare, so the base path is always empty. The domain is the
  repository variable CUSTOM_DOMAIN (a bare domain) when it is set, else jumpingballslive.com. (GitHub Pages is not used: a
  private repository needs a paid GitHub plan for it, and the site lives on Cloudflare.)
inputs:
  custom-domain:
    description: "vars.CUSTOM_DOMAIN – the bare domain the site is served from (jumpingballslive.com or www.jumpingballslive.com); empty: jumpingballslive.com"
    default: ""
outputs:
  url:
    description: "https://… without a trailing slash"
    value: ${{ steps.resolve.outputs.url }}
  base:
    description: "the base path: always '' (the site is at the root of its domain)"
    value: ${{ steps.resolve.outputs.base }}
  domain:
    description: "the bare domain the site is served from"
    value: ${{ steps.resolve.outputs.domain }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        CUSTOM_DOMAIN: ${{ inputs.custom-domain }}
      run: |
        domain="$(printf '%s' "$CUSTOM_DOMAIN" | tr '[:upper:]' '[:lower:]' | sed -E 's#[[:space:]]##g; s#^https?://##; s#/.*$##')"
        if [ -n "$domain" ] && ! printf '%s' "$domain" | grep -Eq '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'; then
          echo "::error title=CUSTOM_DOMAIN is not a domain::Set the repository variable CUSTOM_DOMAIN to the bare domain, e.g. jumpingballslive.com or www.jumpingballslive.com (no https://, no slash), or delete the variable. It is '$CUSTOM_DOMAIN'."
          exit 1
        fi
        if [ -n "$domain" ]; then source="the CUSTOM_DOMAIN variable"; else domain="jumpingballslive.com"; source="the default"; fi
        {
          echo "url=https://$domain"
          echo "base="
          echo "domain=$domain"
        } >> "$GITHUB_OUTPUT"
        echo "Site URL: https://$domain (base path: '', from $source)"
